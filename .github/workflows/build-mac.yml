name: Build Mac App (Universal2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build-mac-app:
    runs-on: macos-latest   # 使用 macOS 最新版本（Intel 或 Apple Silicon 均可）
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'   # 使用 x64 架构，但 PyInstaller 的 universal2 可以生成通用二进制

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Download nexttrace universal binary
        run: |
          # 从 NTrace-core 官方 releases 下载最新的 nexttrace_darwin_universal
          # 请根据最新版本号调整 URL（这里用 v1.0.0 示例，您可替换为实际版本）
          curl -L https://github.com/nxtrace/NTrace-core/releases/latest/download/nexttrace_darwin_universal -o nexttrace
          chmod +x nexttrace

      - name: Build .app with PyInstaller (Universal2)
        run: |
          pyinstaller --target-arch universal2 -F -w \
            --add-data "nexttrace:." \
            --hidden-import requests \
            --hidden-import urllib3 \
            --hidden-import chardet \
            --hidden-import idna \
            --hidden-import certifi \
            nexttrace_mac.py

      - name: Upload artifact (the .app bundle)
        uses: actions/upload-artifact@v4
        with:
          name: NextTrace-Mac-App
          path: dist/nexttrace_mac.app
