name: Build Mac App (Universal2)

on:
  workflow_dispatch:

jobs:
  build-mac-app:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Download nexttrace universal binary
        run: |
          curl -L https://github.com/nxtrace/NTrace-core/releases/latest/download/nexttrace_darwin_universal -o nexttrace
          chmod +x nexttrace

      - name: Build .app with PyInstaller (Universal2)
        run: |
          pyinstaller --target-arch universal2 -F -w \
            --add-data "nexttrace:." \
            --hidden-import requests \
            --hidden-import urllib3 \
            --hidden-import chardet \
            --hidden-import idna \
            --hidden-import certifi \
            nexttraceV3-Mac.py   

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextTrace-Mac-App
          path: dist/nexttraceV3-Mac.app
