name: Build Windows GUI

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（V3.0）'
        required: false
        default: ''
        type: string
      publish_release:
        description: '版本号（V3.0）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install MinGW-w64 for CGO
        shell: pwsh
        run: |
          choco install -y mingw --no-progress

      - name: Sync Go modules in CI
        shell: bash
        env:
          PATH: /c/ProgramData/mingw64/mingw64/bin:/mingw64/bin:$PATH
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          go mod tidy
          go mod download

      - name: Build Windows amd64 GUI EXE
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PATH: /c/ProgramData/mingw64/mingw64/bin:/mingw64/bin:$PATH
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "${VERSION}" ]; then
            APP_VERSION="${VERSION}"
          else
            APP_VERSION="dev-${SHORT_SHA}"
          fi

          LDFLAGS="-s -w -H windowsgui -X main.version=${APP_VERSION} -X main.commit=${SHORT_SHA}"
          go build -ldflags "${LDFLAGS}" -o "dist/ip-batch-track-gui.exe" .
          ls -lh dist/ip-batch-track-gui.exe

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: ip-batch-track-gui-windows-amd64-${{ inputs.version || 'dev' }}
          path: dist/ip-batch-track-gui.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release && inputs.version != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          files: dist/ip-batch-track-gui.exe
          generate_release_notes: true
