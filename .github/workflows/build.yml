name: Manual Build (Windows x64 EXE)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（V3.0）'
        required: false
        default: ''
        type: string
      publish_release:
        description: '版本号（V3.0）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify code and dependencies
        run: |
          go mod tidy
          go vet ./...

      - name: Build Windows amd64 EXE
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "${VERSION}" ]; then
            APP_VERSION="${VERSION}"
          else
            APP_VERSION="dev-${SHORT_SHA}"
          fi

          LDFLAGS="-s -w -X main.version=${APP_VERSION} -X main.commit=${SHORT_SHA}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "dist/ip-batch-track.exe" .
          ls -lh dist/ip-batch-track.exe

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ip-batch-track-windows-amd64-${{ inputs.version || 'dev' }}
          path: dist/ip-batch-track.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release && inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          files: dist/ip-batch-track.exe
          generate_release_notes: true
