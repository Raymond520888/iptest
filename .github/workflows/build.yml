name: Build Windows GUI

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '版本号（V3.0）'
        required: true
        default: false
        type: boolean
      nexttrace_version:
        description: 'NextTrace 版本（留空自动获取最新 Release）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install MinGW-w64 for CGO
        shell: pwsh
        run: |
          choco install -y mingw --no-progress

      - name: Sync Go modules and build Windows amd64 GUI EXE
        shell: bash
        env:
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -e
          sed -i 's/\ba\.SetTheme(/a.Settings().SetTheme(/g' main.go
          grep -n "Settings().SetTheme(" main.go || true

          GCC_EXE=""
          for candidate in \
            "/mingw64/bin/x86_64-w64-mingw32-gcc.exe" \
            "/c/mingw64/bin/x86_64-w64-mingw32-gcc.exe" \
            "/c/ProgramData/mingw64/mingw64/bin/x86_64-w64-mingw32-gcc.exe" \
            "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/x86_64-w64-mingw32-gcc.exe"; do
            if [ -f "$candidate" ]; then
              GCC_EXE="$candidate"
              break
            fi
          done

          if [ -z "$GCC_EXE" ]; then
            GCC_EXE=$(find /c/ProgramData/chocolatey /c/mingw64 /mingw64 -name "x86_64-w64-mingw32-gcc.exe" 2>/dev/null | head -n 1)
          fi

          if [ -z "$GCC_EXE" ]; then
            echo "[-] 未找到 x86_64-w64-mingw32-gcc.exe"
            exit 1
          fi

          GCC_UNIX_DIR=$(cygpath -u "$(dirname "$GCC_EXE")")
          export PATH="$GCC_UNIX_DIR:$PATH"
          echo "[+] 已加入编译器路径: $GCC_UNIX_DIR"
          which x86_64-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc --version | head -n 1

          go mod tidy
          go mod download

          mkdir -p dist/package
          SHORT_SHA=$(git rev-parse --short HEAD)
          APP_VERSION="V3.0"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

          LDFLAGS="-s -w -H windowsgui -X main.version=${APP_VERSION} -X main.commit=${SHORT_SHA}"
          go build -ldflags "${LDFLAGS}" -o "dist/package/ip-batch-track-gui.exe" .

          # 查找 Go 模块缓存中的 WinDivert 运行时文件（x64）
          GOMODCACHE_WIN=$(go env GOMODCACHE)
          GOMODCACHE_UNIX=$(cygpath -u "$GOMODCACHE_WIN")
          echo "[+] 正在查找 WinDivert 运行时文件 (缓存目录: $GOMODCACHE_UNIX)..."

          DLL_SRC=$(find "$GOMODCACHE_UNIX" -iname "WinDivert.dll" 2>/dev/null | grep -iE "x64|amd64|64" | head -n 1)
          if [ -z "$DLL_SRC" ]; then
            DLL_SRC=$(find "$GOMODCACHE_UNIX" -iname "WinDivert.dll" 2>/dev/null | head -n 1)
          fi

          SYS_SRC=$(find "$GOMODCACHE_UNIX" -iname "WinDivert64.sys" 2>/dev/null | head -n 1)

          if [ -n "$DLL_SRC" ]; then
            cp -f "$DLL_SRC" "dist/package/WinDivert.dll"
            echo "[+] 已复制 WinDivert.dll <- $DLL_SRC"
          else
            echo "[!] 未在模块缓存中找到 WinDivert.dll，跳过"
          fi

          if [ -n "$SYS_SRC" ]; then
            cp -f "$SYS_SRC" "dist/package/WinDivert64.sys"
            echo "[+] 已复制 WinDivert64.sys <- $SYS_SRC"
          else
            echo "[!] 警告：未在模块缓存中找到 WinDivert64.sys"
          fi

      - name: Download nexttrace.exe into package directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ inputs.nexttrace_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/nxtrace/NTrace-core/releases/latest" -Headers @{ "User-Agent" = "github-actions" }
            $ver = $release.tag_name
          }
          $url = "https://github.com/nxtrace/NTrace-core/releases/download/$ver/nexttrace_windows_amd64.exe"
          Write-Host "[+] 下载 nexttrace ($ver): $url"
          Invoke-WebRequest -Uri $url -OutFile "dist/package/nexttrace.exe"
          Get-ChildItem "dist/package/" | Select-Object Name, Length

      - name: Pack ZIP archive
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "V3.0" }
          $zipPath = "dist/ip-batch-track-gui-windows-amd64-$ver.zip"
          Compress-Archive -Path "dist/package/*" -DestinationPath $zipPath -Force
          Get-Item $zipPath | Select-Object Name, Length

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ip-batch-track-gui-windows-amd64-${{ env.APP_VERSION }}
          path: dist/ip-batch-track-gui-windows-amd64-${{ env.APP_VERSION }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          files: dist/ip-batch-track-gui-windows-amd64-${{ env.APP_VERSION }}.zip
          generate_release_notes: true
